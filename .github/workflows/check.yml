name: Clippy, Format & Test

on: [pull_request, push, workflow_dispatch]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo test --no-default-features
          cargo test --all-features
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          cargo test -- --ignored
          cargo test --features visual-debug -- --ignored

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --example src_to_svg
      - run: cargo run --example various
      - uses: actions/upload-artifact@v7
        with:
          name: generated-examples
          if-no-files-found: error
          path: |
            examples/nom4_method.svg
            examples/stdlib_examples.html
            examples/nom_examples.html
            examples/syn_examples.html
            examples/various_examples.html
