<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad" viewBox="0 0 1310 316">
<style type="text/css">
svg.railroad {
background-color: hsl(30, 20%, 95%);
background-size: 15px 15px;
background-image: linear-gradient(to right, rgba(30, 30, 30, .05) 1px, transparent 1px),
		  linear-gradient(to bottom, rgba(30, 30, 30, .05) 1px, transparent 1px);
}

svg.railroad rect.railroad_canvas {
stroke-width: 0px;
fill: none;
}

svg.railroad path {
stroke-width: 3px;
stroke: black;
fill: none;
}

svg.railroad .continuation circle,
svg.railroad .continuation-start circle,
svg.railroad .continuation-end circle {
fill: black;
stroke: none;
}

svg.railroad .debug {
stroke-width: 1px;
stroke: red;
}

svg.railroad text {
font: 14px monospace;
text-anchor: middle;
}

svg.railroad .nonterminal text {
font-weight: bold;
}

svg.railroad text.comment {
font: italic 12px monospace;
}

svg.railroad rect,
svg.railroad .annotation > path.annotation-marker {
stroke-width: 3px;
stroke: black;
fill:hsl(-290, 70%, 90%);
}

svg.railroad g.labeledbox > rect,
svg.railroad .annotation > path.annotation-connector {
stroke-width: 1px;
stroke: grey;
stroke-dasharray: 5px;
fill: rgb(90, 90, 150);
fill-opacity: .1;
}

svg.railroad .annotation > path.annotation-connector {
fill: none;
}

/* Annotation markers use wavy arrows distinct from rail traversal arrows. */

svg.railroad .annotation > path.annotation-direction {
stroke-width: 2px;
stroke: black;
}
</style>
<style type="text/css">
svg.railroad .fragment_ty > .nonterminal > rect {
fill: red;
}
svg.railroad .fragment_ident > .nonterminal > rect {
fill: orange;
}

svg.railroad .fragment_path > .nonterminal > rect {
fill: green;
}

svg.railroad .fragment_expr > .nonterminal > rect {
fill: yellow;
}

svg.railroad .fragment_pat > .nonterminal > rect {
fill: deepskyblue;
}

svg.railroad .fragment_pat_param > .nonterminal > rect {
fill: steelblue;
}

svg.railroad .fragment_stmt > .nonterminal > rect {
fill: aqua;
}

svg.railroad .fragment_block > .nonterminal > rect {
fill: aquamarine;
}

svg.railroad .fragment_item > .nonterminal > rect {
fill: thistle;
}

svg.railroad .fragment_meta > .nonterminal > rect {
fill: violet;
}

svg.railroad .fragment_tt > .nonterminal > rect {
fill: turquoise;
}

svg.railroad .fragment_vis > .nonterminal > rect {
fill: gold;
}

svg.railroad .fragment_literal > .nonterminal > rect {
fill: salmon;
}

svg.railroad .fragment_lifetime > .nonterminal > rect {
fill: teal;
}

svg.railroad .legend {
transform: scale(0.85);
transform-origin: bottom left;
/*transform-box: fill-box;*/
}

svg.railroad .legend > rect {
stroke: black;
stroke-width: 0.5px;
stroke-dasharray: 2px;
fill: rgba(90, 90, 90, .1)
}

svg.railroad .legend .comment:first-child {
text-decoration: underline;
}
</style>
